<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PChome 搶購小幫手</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        body {
            font-family: 'Inter', "微軟正黑體", sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e1e2f, #2c2c3e);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h1 {
            text-align: center;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 30px;
            color: #fca311;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2);
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #fca311;
            box-shadow: 0 0 8px rgba(252, 163, 17, 0.4);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            transition: transform 0.1s, box-shadow 0.2s, background 0.3s;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-primary {
            background: #fca311;
            color: #14213d;
        }

        .btn-primary:hover:not(:disabled) {
            background: #ffb703;
            box-shadow: 0 4px 15px rgba(252, 163, 17, 0.4);
        }

        .btn-success {
            background: #4ade80;
            color: #064e3b;
        }

        .btn-success:hover:not(:disabled) {
            background: #22c55e;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .btn-danger:hover:not(:disabled) {
            background: #ef4444;
            color: #fff;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        button:disabled {
            background: rgba(255, 255, 255, 0.1) !important;
            color: #666 !important;
            cursor: not-allowed;
            border: none !important;
        }

        .status-box {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            font-size: 0.95rem;
            min-height: 24px;
            color: #60a5fa;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>PChome 搶購小幫手</h1>
    
    <div class="form-group">
        <label for="url">商品網址</label>
        <input type="text" id="url" placeholder="https://24h.pchome.com.tw/prod/..." value="{{ url }}">
    </div>
    
    <div class="form-group">
        <label for="time">開賣時間 (HH:MM:SS)</label>
        <input type="text" id="time" placeholder="12:00:00" value="{{ time }}" style="text-align: center; font-size: 1.2rem; letter-spacing: 2px;">
    </div>
    
    <button id="btn-browser" class="btn-primary" onclick="openBrowser()">步驟一：開啟瀏覽器並登入</button>
    <button id="btn-schedule" class="btn-success" onclick="startSchedule()" disabled>步驟二：開始定時搶購</button>
    
    <div style="margin-top: 30px;">
        <button class="btn-danger" onclick="closeApp()">關閉整個程式</button>
    </div>
    
    <div class="status-box" id="status-text">
        尚未啟動
    </div>
</div>

<script>
    let pollInterval = null;

    function startPolling() {
        if (!pollInterval) {
            pollInterval = setInterval(fetchStatus, 500);
        }
    }

    async function fetchStatus() {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();
            
            document.getElementById('status-text').innerText = data.status;
            
            const btnBrowser = document.getElementById('btn-browser');
            const btnSchedule = document.getElementById('btn-schedule');
            
            if (data.is_browser_open) {
                btnBrowser.disabled = true;
                btnBrowser.innerText = "瀏覽器已開啟";
                if (!data.is_scheduling) {
                    btnSchedule.disabled = false;
                }
            } else {
                btnBrowser.disabled = false;
                btnBrowser.innerText = "步驟一：開啟瀏覽器並登入";
                btnSchedule.disabled = true;
            }

            if (data.is_scheduling) {
                btnSchedule.disabled = true;
                btnSchedule.innerText = "排程進行中";
            } else if (data.is_browser_open) {
                btnSchedule.innerText = "步驟二：開始定時搶購";
            }

        } catch (e) {
            console.error('無法取得狀態:', e);
            document.getElementById('status-text').innerText = "無法連線至伺服器";
        }
    }

    async function openBrowser() {
        document.getElementById('status-text').innerText = "請求中";
        document.getElementById('btn-browser').disabled = true;
        try {
            const res = await fetch('/api/open_browser', { method: 'POST' });
            const data = await res.json();
            if (!data.success) {
                alert(data.message);
                document.getElementById('btn-browser').disabled = false;
            }
            startPolling();
        } catch (e) {
            alert('請求失敗');
            document.getElementById('btn-browser').disabled = false;
        }
    }

    async function startSchedule() {
        const url = document.getElementById('url').value;
        const time = document.getElementById('time').value;
        
        document.getElementById('btn-schedule').disabled = true;
        
        try {
            const res = await fetch('/api/start_schedule', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url, time })
            });
            const data = await res.json();
            if (!data.success) {
                alert(data.message);
                document.getElementById('btn-schedule').disabled = false;
            }
        } catch (e) {
            alert('請求失敗');
            document.getElementById('btn-schedule').disabled = false;
        }
    }

    async function closeApp() {
        if (!confirm('確定要關閉整個搶購程式與瀏覽器嗎？')) return;
        
        try {
            await fetch('/api/close', { method: 'POST' });
            document.getElementById('status-text').innerText = "程式已關閉。";
            document.body.innerHTML = "<h2 style='text-align:center; margin-top:20vh; color:#ef4444;'>程式已關閉，您可以關閉此網頁視窗。</h2>";
        } catch (e) {
            alert('請求失敗');
        }
    }

    fetchStatus();
    startPolling();
</script>

</body>
</html>
